<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Atmósfera de la Metrópolis de Cobre al anochecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a17"/>
      <stop offset="0.42" stop-color="#241a10"/>
      <stop offset="1" stop-color="#160f0a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#e9b066" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#c8814a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c8814a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#160f0a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="430" r="430" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="116" fill="#f0c074" fill-opacity="0.5"/>
  <!-- silueta lejana de la ciudad de cobre -->
  <g fill="#120c08" fill-opacity="0.72">
    <rect x="60" y="560" width="90" height="340"/>
    <rect x="170" y="610" width="60" height="290"/>
    <rect x="250" y="520" width="74" height="380"/>
    <rect x="344" y="595" width="110" height="305"/>
    <rect x="470" y="545" width="58" height="355"/>
    <rect x="548" y="620" width="96" height="280"/>
    <rect x="980" y="600" width="84" height="300"/>
    <rect x="1080" y="540" width="64" height="360"/>
    <rect x="1162" y="600" width="120" height="300"/>
    <rect x="1300" y="560" width="70" height="340"/>
    <rect x="1388" y="620" width="150" height="280"/>
  </g>
  <g stroke="#e9b066" stroke-opacity="0.20" stroke-width="3">
    <line x1="300" y1="520" x2="300" y2="470"/>
    <line x1="1112" y1="540" x2="1112" y2="486"/>
  </g>
  <!-- bruma inferior para que se funda con el fondo de la página -->
  <rect x="0" y="430" width="1600" height="470" fill="url(#haze)"/>
</svg>
