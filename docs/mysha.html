<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Ficha completa de Mysha Selenne Veltra: hechizos, rites, boons, objetos y contadores de mesa.">
<style>
  :root{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img{ max-width: 100%; }
  [hidden]{ display: none !important; }
</style>
<title>Grimorio de la Vena Carmesí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,800&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ══ Mundo visual único: grimorio de sangre. Se pinta todo explícitamente
      para que no herede el fondo del host en ningún tema. ══ */
:root{
  color-scheme: dark;

  --ink:        #0A0608;   /* negro con sesgo rojo, no gris puro */
  --ink-2:      #120B0E;   /* superficie elevada */
  --ink-3:      #1A0F13;   /* superficie doble */
  --edge:       #2A171D;   /* borde */
  --edge-soft:  #1F1216;

  --blood:      #A31621;   /* carmesí arterial: el acento */
  --blood-dim:  #6E0F17;
  --blood-lit:  #E0485A;   /* estados activos, énfasis alto */

  --bone:       #EFE6DC;   /* texto principal, hueso cálido */
  --ash:        #A2908F;   /* texto secundario, gris con sesgo rojo */
  --ash-dim:    #6E5D60;

  --mysha:      #D293B7;   /* rosa — Blessing of the Pink Coven */
  --selenne:    #8FA4D4;   /* azul lunar — la que estudia */
  --veltra:     #D2673E;   /* óxido de batalla — la espada */

  --ok:         #6E9E76;
  --warn:       #CD9B41;
  --danger:     #E0485A;

  --d: 'Bodoni Moda', 'Didot', Georgia, serif;
  --b: 'Spectral', Georgia, 'Times New Roman', serif;
  --m: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --r: 3px;
  --gut: 16px;
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--b);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button{ font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input{ font: inherit; color: inherit; }
:focus-visible{ outline: 2px solid var(--blood-lit); outline-offset: 2px; }

.app{
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 720px;
  margin: 0 auto;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(163,22,33,.14), transparent 62%),
    var(--ink);
}

/* ─────────── Barra superior ─────────── */
.topbar{
  border-bottom: 1px solid var(--edge);
  background: var(--ink-2);
  padding: 10px var(--gut) 8px;
  display: grid;
  gap: 8px;
}
.switch{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: var(--ink);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  padding: 3px;
}
.switch button{
  padding: 9px 4px 8px;
  border-radius: 2px;
  display: grid;
  gap: 1px;
  justify-items: center;
  min-height: 46px;
  transition: background .16s ease;
}
.switch b{
  font-family: var(--d);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--ash);
  line-height: 1.1;
}
.switch small{
  font-family: var(--m);
  font-size: 8.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ash-dim);
}
.switch button[aria-pressed="true"]{ background: var(--ink-3); }
.switch button[aria-pressed="true"] b{ color: var(--pc); }
.switch button[aria-pressed="true"] small{ color: var(--ash); }

.glance{
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--m);
  font-size: 11px;
  color: var(--ash);
}
.glance .hpwrap{ flex: 1; display: grid; gap: 4px; }
.hpbar{
  height: 5px;
  background: var(--ink-3);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
}
.hpbar i{ display: block; height: 100%; background: var(--blood); transition: width .25s ease; }
.hpbar i.tmp{ background: var(--selenne); }
.glance .hpnum{ display: flex; justify-content: space-between; align-items: baseline; }
.glance .hpnum b{ font-weight: 600; color: var(--bone); font-size: 13px; }
.glance .hpnum span{ color: var(--ash-dim); }
.glance .flags{ display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 46%; }
.flag{
  font-family: var(--m);
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 5px;
  border-radius: 2px;
  background: var(--blood-dim);
  color: #F6DCDF;
  white-space: nowrap;
}
.flag.conc{ background: #23324F; color: #CBD8F2; }
.flag.agot{ background: #4A3410; color: #F0DDB4; }

/* ─────────── Contenido ─────────── */
main{
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut);
  padding-block: 18px 34px;
}
.sec{ margin: 0 0 30px; }
.sec:last-child{ margin-bottom: 0; }

h2.t{
  font-family: var(--d);
  font-size: 23px;
  font-weight: 600;
  line-height: 1.15;
  margin: 0 0 3px;
  text-wrap: balance;
}
.eyebrow{
  font-family: var(--m);
  font-size: 9.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--blood-lit);
  margin: 0 0 14px;
}
h3.s{
  font-family: var(--m);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ash);
  margin: 0 0 9px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--edge-soft);
}
p{ margin: 0 0 10px; }
p:last-child{ margin-bottom: 0; }
strong{ color: var(--bone); font-weight: 600; }
em{ color: var(--ash); }
ul.body{ margin: 0 0 10px; padding-left: 17px; }
ul.body li{ margin-bottom: 5px; }
h4.sub{
  font-family: var(--d);
  font-size: 15px;
  font-weight: 600;
  margin: 14px 0 6px;
  color: var(--bone);
}

/* Bloque genérico */
.card{
  background: var(--ink-2);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  padding: 14px;
}
.stack{ display: grid; gap: 10px; }

/* Retícula de estadísticas */
.grid3{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--edge); border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; }
.grid6{ display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--edge); border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; }
.cell{ background: var(--ink-2); padding: 10px 6px; text-align: center; }
.cell .k{ font-family: var(--m); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); display: block; }
.cell .v{ font-family: var(--m); font-size: 19px; font-weight: 600; color: var(--bone); font-variant-numeric: tabular-nums; display: block; line-height: 1.3; }
.cell .v small{ font-size: 11px; color: var(--ash); font-weight: 400; }

/* Filas etiqueta / valor */
.rows{ display: grid; }
.row{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--edge-soft);
}
.row:last-child{ border-bottom: none; }
.row .k{ color: var(--ash); font-size: 15px; }
.row .v{ font-family: var(--m); font-size: 15px; font-weight: 600; color: var(--bone); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Avisos */
.note{
  border-left: 2px solid var(--ash-dim);
  padding: 8px 0 8px 11px;
  font-size: 14px;
  color: var(--ash);
  margin: 10px 0 0;
}
.note.warn{ border-left-color: var(--warn); color: #E4CFA4; }
.note.bad{ border-left-color: var(--danger); color: #F0C3C8; }
.note b{ color: inherit; }
.note .lab{
  font-family: var(--m);
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 3px;
  opacity: .8;
}

/* ─────────── Pestañas ─────────── */
.tabbar{
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--edge);
  background: var(--ink-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button{
  padding: 9px 2px 10px;
  display: grid;
  gap: 4px;
  justify-items: center;
  min-height: 54px;
  align-content: center;
  border-top: 2px solid transparent;
  margin-top: -1px;
}
.tabbar svg{ width: 19px; height: 19px; stroke: var(--ash-dim); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tabbar span{
  font-family: var(--m);
  font-size: 8.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ash-dim);
}
.tabbar button[aria-selected="true"]{ border-top-color: var(--blood); }
.tabbar button[aria-selected="true"] svg{ stroke: var(--blood-lit); }
.tabbar button[aria-selected="true"] span{ color: var(--bone); }

/* ─────────── Hechizos ─────────── */
.seek{
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--ink-2);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  padding: 0 12px;
  margin-bottom: 10px;
}
.seek input{
  flex: 1;
  background: none;
  border: none;
  padding: 12px 0;
  font-size: 16px;
  min-width: 0;
}
.seek input::placeholder{ color: var(--ash-dim); }
.seek svg{ width: 15px; height: 15px; stroke: var(--ash-dim); fill: none; stroke-width: 1.6; flex: none; }
.seek button.clr{ color: var(--ash-dim); font-size: 20px; line-height: 1; padding: 6px; }

.chips{ display: flex; gap: 5px; overflow-x: auto; padding-bottom: 9px; margin-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar{ display: none; }
.chip{
  flex: none;
  font-family: var(--m);
  font-size: 10.5px;
  letter-spacing: .06em;
  padding: 7px 11px;
  border: 1px solid var(--edge);
  border-radius: 99px;
  color: var(--ash);
  background: var(--ink-2);
  white-space: nowrap;
  min-height: 32px;
}
.chip[aria-pressed="true"]{ background: var(--blood-dim); border-color: var(--blood); color: #F7E2E4; }
.chip.m[aria-pressed="true"]{ background: #3B2432; border-color: var(--mysha); color: #F3DCE9; }
.chip.s[aria-pressed="true"]{ background: #212B45; border-color: var(--selenne); color: #DCE4F6; }

.count{ font-family: var(--m); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); margin: 6px 0 12px; }

.lvlhead{
  font-family: var(--m);
  font-size: 9.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ash-dim);
  margin: 20px 0 7px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.lvlhead::after{ content:""; flex: 1; height: 1px; background: var(--edge-soft); }
.lvlhead:first-child{ margin-top: 0; }

.spell{
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 11px;
  align-items: start;
  padding: 11px 12px;
  background: var(--ink-2);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  margin-bottom: 6px;
  min-height: 56px;
}
.spell:active{ background: var(--ink-3); }
.lvl{
  font-family: var(--m);
  font-size: 15px;
  font-weight: 600;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--ink);
  border: 1px solid var(--edge);
  color: var(--ash);
  font-variant-numeric: tabular-nums;
}
.spell.m .lvl{ color: var(--mysha); border-color: #4A2E3E; }
.spell.s .lvl{ color: var(--selenne); border-color: #2C3550; }
.spell .nm{
  font-family: var(--d);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.25;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.spell .mt{ font-family: var(--m); font-size: 11px; color: var(--ash); margin-top: 2px; line-height: 1.4; }
.dot{ width: 6px; height: 6px; border-radius: 99px; flex: none; }
.dot.c{ background: var(--warn); }
.dot.w{ background: var(--danger); }
.tag{
  font-family: var(--m);
  font-size: 8.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 5px;
  border-radius: 2px;
  background: var(--ink-3);
  border: 1px solid var(--edge);
  color: var(--ash);
  flex: none;
}
.tag.v16{ border-color: #4A3410; color: var(--warn); }
.tag.old{ border-color: var(--edge); color: var(--ash-dim); }
.spell.hist{ opacity: .52; }
.spell.hist .nm{ text-decoration: line-through; text-decoration-color: var(--ash-dim); }

/* Hoja de detalle */
.sheet{
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--ink);
  display: grid;
  grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise .2s ease;
}
@keyframes rise{ from{ transform: translateY(14px); opacity: 0; } to{ transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce){ .sheet{ animation: none; } .hpbar i{ transition: none; } }
.sheet header{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px var(--gut);
  border-bottom: 1px solid var(--edge);
  background: var(--ink-2);
}
.sheet header .back{ font-family: var(--m); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); padding: 8px 0; min-height: 40px; display: flex; align-items: center; gap: 6px; }
.sheet .body{ overflow-y: auto; padding: 18px var(--gut) 40px; max-width: 720px; margin: 0 auto; width: 100%; }

.meta{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--edge); border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; margin: 14px 0; }
.meta div{ background: var(--ink-2); padding: 9px 11px; }
.meta .k{ font-family: var(--m); font-size: 8.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ash-dim); display: block; margin-bottom: 2px; }
.meta .v{ font-size: 14px; line-height: 1.35; }
.meta div.full{ grid-column: 1 / -1; }

details.orig{ margin-top: 18px; border-top: 1px solid var(--edge-soft); padding-top: 12px; }
details.orig summary{ font-family: var(--m); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash-dim); cursor: pointer; padding: 5px 0; min-height: 30px; }
details.orig .en{ font-size: 14px; color: var(--ash); margin-top: 8px; }
details.orig .en p{ margin-bottom: 8px; }

.cast{ display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
.cast button{
  flex: 1 1 140px;
  padding: 13px 10px;
  border: 1px solid var(--blood);
  background: var(--blood-dim);
  border-radius: var(--r);
  font-family: var(--m);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #F7E2E4;
  min-height: 46px;
}
.cast button.ghost{ background: var(--ink-2); border-color: var(--edge); color: var(--ash); }
.cast button:disabled{ opacity: .38; }

/* ─────────── Mesa ─────────── */
.hpbig{ background: var(--ink-2); border: 1px solid var(--edge); border-radius: var(--r); padding: 16px 14px; }
.hpbig .num{
  font-family: var(--m);
  font-size: 46px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.hpbig .num.low{ color: var(--danger); }
.hpbig .num .max{ font-size: 18px; color: var(--ash-dim); font-weight: 400; }
.hpbig .tmp{ font-family: var(--m); font-size: 12px; color: var(--selenne); margin-top: 3px; }
.pad{ display: grid; grid-template-columns: 1fr auto auto; gap: 7px; margin-top: 13px; }
.pad input{
  background: var(--ink);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  padding: 11px 12px;
  font-family: var(--m);
  font-size: 17px;
  text-align: center;
  min-width: 0;
  width: 100%;
  font-variant-numeric: tabular-nums;
}
.pad button{
  padding: 11px 15px;
  border-radius: var(--r);
  font-family: var(--m);
  font-size: 11px;
  letter-spacing: .07em;
  text-transform: uppercase;
  border: 1px solid var(--edge);
  min-height: 46px;
}
.pad button.dmg{ background: var(--blood-dim); border-color: var(--blood); color: #F7E2E4; }
.pad button.heal{ background: #17301C; border-color: #2C5233; color: #C6E2CB; }
.padrow2{ display: flex; gap: 7px; margin-top: 7px; }
.padrow2 button{
  flex: 1;
  padding: 9px 6px;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  font-family: var(--m);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ash);
  min-height: 40px;
}

.pips{ display: flex; gap: 5px; flex-wrap: wrap; }
.pip{
  width: 27px;
  height: 27px;
  border-radius: 2px;
  border: 1px solid var(--edge);
  background: var(--ink);
  font-family: var(--m);
  font-size: 10px;
  color: var(--ash-dim);
  display: grid;
  place-items: center;
}
.pip.on{ background: var(--blood); border-color: var(--blood-lit); color: #fff; }
.pip.big{ width: 34px; height: 34px; font-size: 12px; }

.slotrow{ display: flex; align-items: center; gap: 11px; padding: 8px 0; border-bottom: 1px solid var(--edge-soft); }
.slotrow:last-child{ border-bottom: none; }
.slotrow .lv{ font-family: var(--m); font-size: 12px; color: var(--ash); width: 58px; flex: none; white-space: nowrap; }
.slotrow .bm{ font-family: var(--m); font-size: 9.5px; color: var(--ash-dim); margin-left: auto; white-space: nowrap; }

.resrow{ display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--edge-soft); }
.resrow:last-child{ border-bottom: none; }
.resrow .nm{ flex: 1; font-size: 14.5px; line-height: 1.3; }
.resrow .nm small{ display: block; font-family: var(--m); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-dim); margin-top: 1px; }
.stepper{ display: flex; align-items: center; gap: 2px; flex: none; }
.stepper button{
  width: 36px; height: 36px;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  background: var(--ink);
  font-size: 18px;
  line-height: 1;
  color: var(--ash);
  display: grid; place-items: center;
}
.stepper .val{ font-family: var(--m); font-size: 14px; font-weight: 600; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .val.zero{ color: var(--ash-dim); }

.condgrid{ display: flex; flex-wrap: wrap; gap: 6px; }
.cond{
  font-family: var(--m);
  font-size: 11px;
  padding: 9px 11px;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  background: var(--ink-2);
  color: var(--ash);
  min-height: 38px;
}
.cond[aria-pressed="true"]{ background: var(--blood-dim); border-color: var(--blood); color: #F7E2E4; }
.cond.conc[aria-pressed="true"]{ background: #23324F; border-color: #4A6299; color: #CBD8F2; }

.ovgrid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 7px; }
.ov{ background: var(--ink-2); border: 1px solid var(--edge); border-radius: var(--r); padding: 8px 9px; }
.ov label{ font-family: var(--m); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); display: block; margin-bottom: 4px; }
.ov input{
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--edge-soft);
  border-radius: 2px;
  padding: 8px 6px;
  font-family: var(--m);
  font-size: 17px;
  font-weight: 600;
  text-align: center;
  font-variant-numeric: tabular-nums;
  min-height: 38px;
}
.ov input.edited{ border-color: var(--warn); color: var(--warn); }

.bmcalc .lvls{ display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.bmout{ background: var(--ink); border: 1px solid var(--edge); border-radius: var(--r); padding: 12px; display: grid; gap: 9px; }
.bmout .big{ font-family: var(--m); font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bmout .sub{ font-family: var(--m); font-size: 11px; color: var(--ash); }
.bmout .sub b{ color: var(--warn); }

.big-btn{
  width: 100%;
  padding: 14px;
  border-radius: var(--r);
  font-family: var(--m);
  font-size: 11.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  border: 1px solid var(--edge);
  background: var(--ink-2);
  color: var(--ash);
  min-height: 50px;
}
.big-btn.prime{ background: var(--blood-dim); border-color: var(--blood); color: #F7E2E4; }
.two{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.toast{
  position: fixed;
  left: 50%;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink-3);
  border: 1px solid var(--blood);
  color: var(--bone);
  font-family: var(--m);
  font-size: 12px;
  padding: 10px 16px;
  border-radius: var(--r);
  z-index: 60;
  max-width: calc(100% - 32px);
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}

.sync{ font-family: var(--m); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); text-align: center; margin-top: 18px; }
.sync b{ color: var(--ok); font-weight: 400; }

/* Acordeón */
.acc{ border: 1px solid var(--edge); border-radius: var(--r); background: var(--ink-2); margin-bottom: 7px; overflow: hidden; }
.acc > summary{
  list-style: none;
  padding: 13px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 50px;
}
.acc > summary::-webkit-details-marker{ display: none; }
.acc > summary .ttl{ flex: 1; font-family: var(--d); font-size: 16px; font-weight: 600; line-height: 1.25; }
.acc > summary .mt{ font-family: var(--m); font-size: 10px; color: var(--ash-dim); margin-top: 2px; display: block; font-weight: 400; letter-spacing: .04em; }
.acc > summary .car{ color: var(--ash-dim); font-size: 12px; flex: none; transition: transform .15s ease; }
.acc[open] > summary .car{ transform: rotate(90deg); }
.acc .in{ padding: 0 14px 14px; border-top: 1px solid var(--edge-soft); padding-top: 12px; }

table.dmg{ width: 100%; border-collapse: collapse; font-family: var(--m); font-size: 12.5px; margin: 10px 0; }
table.dmg th, table.dmg td{ padding: 7px 8px; border-bottom: 1px solid var(--edge-soft); text-align: left; }
table.dmg th{ font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); font-weight: 400; }
table.dmg td:last-child, table.dmg th:last-child{ text-align: right; font-variant-numeric: tabular-nums; }
.tw{ overflow-x: auto; }

.port{ display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.port .pic{ width: 68px; height: 68px; border-radius: 2px; flex: none; background: var(--ink-3); border: 1px solid var(--edge); display: grid; place-items: center; overflow: hidden; }
.port .pic img{ width: 100%; height: 100%; object-fit: cover; display: block; }
.port .pic .sig{ font-family: var(--d); font-size: 28px; font-weight: 600; color: var(--pc); }
.port .who .nm{ font-family: var(--d); font-size: 22px; font-weight: 600; line-height: 1.1; }
.port .who .rl{ font-family: var(--m); font-size: 10.5px; color: var(--ash); margin-top: 3px; line-height: 1.4; }
</style>

<script>
(function(){
"use strict";

var D = window.MSV;
// Los de spells-c vienen del vault de nivel 16 y entran en cualquier nivel,
// así que hay que ordenar: la lista agrupa por niveles consecutivos.
var SPELLS = (window.MSV_SPELLS_A || [])
  .concat(window.MSV_SPELLS_B || [])
  .concat(window.MSV_SPELLS_C || [])
  .sort(function(a, b){
    if (a.nivel !== b.nivel) return a.nivel - b.nivel;
    return a.nombre.localeCompare(b.nombre, 'es');
  });
var view = document.getElementById('view');

/* ══════════ Estado ══════════ */
var KEY = 'msv-mesa-v1';
var DB = null, dbTimer = null;

function blank(){
  var s = {
    p: 'selenne',
    hp: D.cuerpo.hpMax, hpTemp: 0,
    slots: {}, res: {}, cond: {}, agot: 0,
    conc: '', ov: {}, updatedAt: 0
  };
  for (var i = 1; i <= 9; i++) s.slots[i] = 0;
  D.recursos.forEach(function(r){ s.res[r.id] = 0; });
  return s;
}
var S = blank();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw) merge(JSON.parse(raw));
  }catch(e){ /* almacenamiento bloqueado: se sigue en memoria */ }
}
function merge(o){
  if (!o || typeof o !== 'object') return;
  var b = blank();
  S.p = o.p || b.p;
  S.hp = typeof o.hp === 'number' ? o.hp : b.hp;
  S.hpTemp = typeof o.hpTemp === 'number' ? o.hpTemp : 0;
  S.agot = typeof o.agot === 'number' ? o.agot : 0;
  S.conc = typeof o.conc === 'string' ? o.conc : '';
  S.updatedAt = o.updatedAt || 0;
  S.slots = {}; for (var i = 1; i <= 9; i++) S.slots[i] = (o.slots && o.slots[i]) || 0;
  S.res = {}; D.recursos.forEach(function(r){ S.res[r.id] = (o.res && o.res[r.id]) || 0; });
  S.cond = (o.cond && typeof o.cond === 'object') ? o.cond : {};
  S.ov = (o.ov && typeof o.ov === 'object') ? o.ov : {};
}
function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if (DB){
    clearTimeout(dbTimer);
    dbTimer = setTimeout(function(){
      try{ DB.doc('mesa/estado').set(JSON.parse(JSON.stringify(S))); }catch(e){}
    }, 700);
  }
}

/* ══════════ Utilidades ══════════ */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function fmt(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*]+?)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>')
    .replace(/`([^`]+?)`/g, '<code style="font-family:var(--m);font-size:.9em;color:var(--blood-lit)">$1</code>');
}
// Renderiza un array de líneas con soporte de viñetas y subtítulos.
function block(lines){
  if (!lines || !lines.length) return '';
  var out = '', bullets = [];
  function flush(){
    if (bullets.length){ out += '<ul class="body">' + bullets.join('') + '</ul>'; bullets = []; }
  }
  lines.forEach(function(ln){
    if (/^###\s+/.test(ln)){ flush(); out += '<h4 class="sub">' + fmt(ln.replace(/^###\s+/, '')) + '</h4>'; }
    else if (/^[-•]\s+/.test(ln)){ bullets.push('<li>' + fmt(ln.replace(/^[-•]\s+/, '')) + '</li>'); }
    else { flush(); out += '<p>' + fmt(ln) + '</p>'; }
  });
  flush();
  return out;
}
function pers(id){ for (var i = 0; i < D.personalidades.length; i++) if (D.personalidades[i].id === id) return D.personalidades[i]; return D.personalidades[1]; }
function num(v){ return (v >= 0 ? '+' : '') + v; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function stat(k){
  if (S.ov[k] !== undefined && S.ov[k] !== null && S.ov[k] !== '') return S.ov[k];
  if (k === 'ca') return D.cuerpo.ca;
  if (k === 'cd') return D.cuerpo.cd;
  if (k === 'atk') return D.cuerpo.ataque;
  if (k === 'vel') return D.cuerpo.velocidad;
  if (k === 'ini') return pers(S.p).iniciativa;
  if (k === 'hpMax') return D.cuerpo.hpMax;
  return 0;
}
var toastT = null;
function toast(msg){
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.remove(); }, 2600);
}
function roll(n, faces){ var t = 0; for (var i = 0; i < n; i++) t += 1 + Math.floor(Math.random() * faces); return t; }

/* ══════════ Cabecera ══════════ */
function paintSwitch(){
  document.getElementById('switch').innerHTML = D.personalidades.map(function(p){
    return '<button data-p="' + p.id + '" aria-pressed="' + (S.p === p.id) + '" style="--pc:var(--' + p.id + ')">' +
      '<b>' + esc(p.nombre) + '</b><small>' + esc(p.arma.split(' ')[0]) + '</small></button>';
  }).join('');
}
function paintGlance(){
  var max = stat('hpMax');
  var pct = clamp(S.hp / max * 100, 0, 100);
  var tpct = clamp(S.hpTemp / max * 100, 0, 100 - pct);
  document.getElementById('gBar').style.width = pct + '%';
  document.getElementById('gTmp').style.width = tpct + '%';
  document.getElementById('gHp').textContent = S.hp + ' / ' + max + (S.hpTemp ? ' +' + S.hpTemp : '');
  document.getElementById('gFlags').textContent =
    'CA ' + stat('ca') + ' · CD ' + stat('cd') + ' · ' + num(stat('atk'));

  var f = [];
  if (S.conc) f.push('<span class="flag conc">Conc: ' + esc(S.conc.slice(0, 16)) + '</span>');
  if (S.agot > 0) f.push('<span class="flag agot">Agot ' + S.agot + '</span>');
  D.estados.forEach(function(c){
    if (c.especial) return;
    if (S.cond[c.id]) f.push('<span class="flag">' + esc(c.nombre) + '</span>');
  });
  document.getElementById('gCond').innerHTML = f.join('');
}

function acc(t, meta, inner, open){

/* ══════════ Vista: HECHIZOS ══════════ */
var F = { q: '', nivel: null, duena: null, conc: false, ritual: false };
function viewHechizos(){
  var h = '<div class="sec">';
  h += '<p class="eyebrow">Grimorio · ' + SPELLS.length + ' hechizos</p><h2 class="t">Hechizos y cantrips</h2>';
  h += '<div style="margin-top:14px"></div>';
  h += '<div class="seek"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>' +
       '<input id="q" type="search" placeholder="Buscar por nombre, escuela o efecto…" value="' + esc(F.q) + '" autocomplete="off">' +
       '<button class="clr" id="clrq" aria-label="Limpiar búsqueda">×</button></div>';

  h += '<div class="chips" role="group" aria-label="Filtrar por dueña">' +
    '<button class="chip m" data-d="mysha" aria-pressed="' + (F.duena === 'mysha') + '">Mysha</button>' +
    '<button class="chip s" data-d="selenne" aria-pressed="' + (F.duena === 'selenne') + '">Selenne</button>' +
    '<button class="chip" data-c="1" aria-pressed="' + F.conc + '">Concentración</button>' +
    '<button class="chip" data-r="1" aria-pressed="' + F.ritual + '">Rituales</button>' +
    '</div>';
  h += '<div class="chips" role="group" aria-label="Filtrar por nivel">' +
    '<button class="chip" data-n="0" aria-pressed="' + (F.nivel === 0) + '">Cantrips</button>' +
    [1,2,3,4,5,6,7,8,9].map(function(n){
      return '<button class="chip" data-n="' + n + '" aria-pressed="' + (F.nivel === n) + '">Nivel ' + n + '</button>';
    }).join('') + '</div>';

  h += '<div id="list">' + spellList() + '</div>';
  h += '</div>';
  return h;
}

// Solo la lista se rehace al escribir en el buscador, para no perder el foco
// ni hacer saltar el teclado del celular.
function spellList(){
  var h = '';
  var list = SPELLS.filter(function(s){
    if (F.nivel !== null && s.nivel !== F.nivel) return false;
    if (F.duena && s.duena !== F.duena) return false;
    if (F.conc && !s.concentracion) return false;
    if (F.ritual && !s.ritual) return false;
    if (F.q){
      var q = F.q.toLowerCase();
      var hay = (s.nombre + ' ' + s.escuela + ' ' + (s.resumen || '') + ' ' + (s.tirada || '') + ' ' +
                 (s.t || []).join(' ') + ' ' + (s.nota || '') + ' ' + (s.componentes || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  h += '<p class="count">' + list.length + (list.length === 1 ? ' hechizo' : ' hechizos') +
       (list.length !== SPELLS.length ? ' de ' + SPELLS.length : '') + '</p>';

  if (!list.length){
    h += '<div class="card" style="text-align:center;color:var(--ash)">Ningún hechizo coincide. Probá con otro término o sacá un filtro.</div>';
  } else {
    var lastLv = -99;
    list.forEach(function(s){
      if (s.nivel !== lastLv){
        lastLv = s.nivel;
        h += '<div class="lvlhead">' + (s.nivel === 0 ? 'Cantrips' : 'Nivel ' + s.nivel) + '</div>';
      }
      var mark = '';
      if (s.concentracion) mark += '<span class="dot c" title="Concentración"></span>';
      if (s.aviso || s.roto) mark += '<span class="dot w" title="Revisar la fuente"></span>';
      if (s.ritual) mark += '<span class="tag">ritual</span>';
      if (s.historico) mark += '<span class="tag old">histórico</span>';
      else if (s.origen === 'v16') mark += '<span class="tag v16">v16</span>';
      var costo = s.nivel > 0 ? ' · sangre ' + (2 * s.nivel) + 'd8' : '';
      h += '<button class="spell ' + (s.duena === 'mysha' ? 'm' : 's') + (s.historico ? ' hist' : '') + '" data-s="' + s.id + '">' +
        '<span class="lvl">' + (s.nivel === 0 ? 'C' : s.nivel) + '</span>' +
        '<span><span class="nm">' + esc(s.nombre) + mark + '</span>' +
        '<span class="mt">' + esc(s.resumen || s.escuela) + ' · ' + esc(s.tiempo) + costo + '</span></span></button>';
    });
  }
  return h;
}
function repaintList(){
  var el = document.getElementById('list');
  if (el) el.innerHTML = spellList();
}

function sheetHechizo(id){
  var s = null;
  for (var i = 0; i < SPELLS.length; i++) if (SPELLS[i].id === id) s = SPELLS[i];
  if (!s) return;
  var col = s.duena === 'mysha' ? 'mysha' : 'selenne';
  var h = '<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="' + esc(s.nombre) + '">';
  h += '<header><button class="back" id="closeSheet">‹ Grimorio</button></header><div class="body">';
  h += '<p class="eyebrow" style="color:var(--' + col + ')">' +
       (s.nivel === 0 ? 'Cantrip' : 'Nivel ' + s.nivel) + ' · ' + esc(pers(s.duena).nombre) +
       (s.ritual ? ' · Ritual' : '') + '</p>';
  h += '<h2 class="t" style="font-size:27px">' + esc(s.nombre) + '</h2>';

  h += '<div class="meta">' +
    mcell('Tiempo', s.tiempo) + mcell('Alcance', s.alcance) +
    mcell('Duración', s.duracion) + mcell('Escuela', s.escuela) +
    mcell('Concentración', s.concentracion ? 'Sí' : 'No') + mcell('Tirada', s.tirada || '—') +
    '<div class="full"><span class="k">Componentes</span><span class="v">' + esc(s.componentes || '—') + '</span></div>' +
    '</div>';

  if (s.origen === 'v16') h += '<div class="note warn"><span class="lab">Recuperado del vault de nivel 16</span>' +
    'Este hechizo existe en <code style="font-family:var(--m);font-size:.9em">Obsidian\\Rol\\Rol\\Mysha Selenne Veltra\\Spells</code> pero no en la carpeta de nivel 17. Confirmá con el DM que sigue vigente antes de usarlo.</div>';
  if (s.n17) h += '<div class="note"><span class="lab">A nivel 17</span>' + fmt(s.n17) + '</div>';
  if (s.aviso) h += '<div class="note bad"><span class="lab">Revisar la fuente</span>' + fmt(s.aviso) + '</div>';

  if (s.nivel > 0){
    var bm = D.bloodMagic.tabla[s.nivel - 1];
    h += '<div class="cast">' +
      '<button data-cast="slot" data-lv="' + s.nivel + '"' + (S.slots[s.nivel] >= D.espaciosMax[s.nivel] ? ' disabled' : '') + '>' +
        'Gastar espacio ' + s.nivel + ' (' + (D.espaciosMax[s.nivel] - S.slots[s.nivel]) + ')</button>' +
      '<button class="ghost" data-cast="blood" data-lv="' + s.nivel + '"' + (S.res.bloodmagic >= D.bloodMagic_max() ? ' disabled' : '') + '>' +
        'Blood Magic · ' + bm.coste + '</button></div>';
    h += '<p style="font-family:var(--m);font-size:10.5px;color:var(--ash-dim);margin-top:2px">' +
      'Blood Magic: ' + bm.coste + ' PV (prom. ' + bm.promedio + ')' + (bm.agotamiento ? ' · ' + bm.agotamiento + ' de agotamiento' : ' · sin agotamiento') + '</p>';
  }

  h += '<div style="margin-top:20px">' + block(s.t) + '</div>';

  if (s.escalado) h += '<div class="sec" style="margin-top:20px"><h3 class="s">A niveles superiores</h3>' + block(s.escalado) + '</div>';
  if (s.nota) h += '<div class="note"><span class="lab">En esta mesa</span>' + fmt(s.nota) + '</div>';

  if (s.o && s.o.length){
    h += '<details class="orig"><summary>Texto original en inglés</summary><div class="en">' +
      s.o.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div></details>';
  } else if (s.fuenteEs){
    h += '<details class="orig"><summary>Sobre esta traducción</summary><div class="en"><p>El archivo fuente de este hechizo ya está escrito en español. El texto de arriba es el original, solo con la ortografía y el formato corregidos.</p></div></details>';
  }

  h += '</div></div>';
  var wrap = document.createElement('div');
  wrap.innerHTML = h;
  document.body.appendChild(wrap.firstChild);
  document.getElementById('sheet').querySelector('.body').scrollTop = 0;
}
function mcell(k, v){ return '<div><span class="k">' + k + '</span><span class="v">' + esc(v || '—') + '</span></div>'; }
D.bloodMagic_max = function(){ return D.recursos.filter(function(r){ return r.id === 'bloodmagic'; })[0].max; };

/* ══════════ Vista: MESA ══════════ */
var bmLvl = 1;
function viewMesa(){
  var max = stat('hpMax');
  var low = S.hp <= max * 0.3;
  var h = '<div class="sec">';
  h += '<p class="eyebrow">En combate</p><h2 class="t">Mesa</h2>';

  // ── Vida
  h += '<div class="hpbig" style="margin-top:14px">' +
    '<div class="num' + (low ? ' low' : '') + '">' + S.hp + '<span class="max"> / ' + max + '</span></div>' +
    (S.hpTemp ? '<div class="tmp">+' + S.hpTemp + ' PV temporales</div>' : '') +
    '<div class="pad">' +
      '<input id="amt" type="number" inputmode="numeric" placeholder="0" min="0" aria-label="Cantidad">' +
      '<button class="dmg" data-hp="dmg">Daño</button>' +
      '<button class="heal" data-hp="heal">Curar</button>' +
    '</div>' +
    '<div class="padrow2">' +
      '<button data-hp="temp">+ Temporales</button>' +
      '<button data-hp="full">Al máximo</button>' +
      '<button data-hp="zero">A 0</button>' +
    '</div></div>';

  // ── Estados
  h += '<div class="sec" style="margin-top:26px"><h3 class="s">Estados</h3><div class="condgrid">';
  h += '<button class="cond conc" data-conc="1" aria-pressed="' + (!!S.conc) + '">Concentración</button>';
  D.estados.forEach(function(c){
    if (c.especial) return;
    h += '<button class="cond" data-cond="' + c.id + '" aria-pressed="' + (!!S.cond[c.id]) + '">' + esc(c.nombre) + '</button>';
  });
  h += '</div>';

  if (S.conc){
    h += '<div style="margin-top:10px"><div class="ov"><label for="concnm">Concentrando en</label>' +
      '<input id="concnm" type="text" value="' + esc(S.conc === '1' ? '' : S.conc) + '" placeholder="Nombre del hechizo" style="text-align:left;font-family:var(--b);font-weight:400"></div></div>';
  }

  var activos = D.estados.filter(function(c){ return c.especial ? !!S.conc : !!S.cond[c.id]; });
  if (activos.length){
    h += '<div style="margin-top:12px">';
    activos.forEach(function(c){
      h += '<div class="note bad"><span class="lab">' + esc(c.nombre) + '</span>' + fmt(c.texto) +
        (c.nota ? '<br><span style="color:var(--ash)">' + fmt(c.nota) + '</span>' : '') + '</div>';
    });
    h += '</div>';
  } else {
    h += '<p class="count" style="margin:12px 0 0">Sin estados activos.</p>';
  }
  h += acc('Ver todas las reglas de estado', '', D.estados.map(function(c){
    return '<h4 class="sub">' + esc(c.nombre) + '</h4><p style="font-size:14.5px">' + fmt(c.texto) + '</p>' +
      (c.nota ? '<p style="font-size:13.5px;color:var(--ash)">' + fmt(c.nota) + '</p>' : '');
  }).join(''));
  h += '</div>';

  // ── Agotamiento
  h += '<div class="sec"><h3 class="s">Agotamiento</h3><div class="pips">';
  for (var a = 0; a <= 6; a++){
    h += '<button class="pip big' + (S.agot >= a && a > 0 ? ' on' : '') + '" data-agot="' + a + '" aria-label="Agotamiento ' + a + '">' + (a === 0 ? '0' : a) + '</button>';
  }
  h += '</div>';
  if (S.agot > 0){
    h += '<div style="margin-top:10px">';
    D.agotamiento.slice(0, S.agot).forEach(function(x){
      h += '<div class="row"><span class="k">Nivel ' + x.n + '</span><span style="text-align:right;font-size:14px">' + esc(x.texto) + '</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="note"><span class="lab">Ojo</span>Blood Magic da agotamiento desde nivel 6: 1 nivel a nivel 6, y sube hasta 4 a nivel 9.</div></div>';

  // ── Espacios
  h += '<div class="sec"><h3 class="s">Espacios de conjuro</h3>';
  for (var lv = 1; lv <= 9; lv++){
    var mx = D.espaciosMax[lv], used = S.slots[lv];
    h += '<div class="slotrow"><span class="lv">Nivel ' + lv + '</span><span class="pips">';
    for (var i = 0; i < mx; i++){
      h += '<button class="pip' + (i < used ? ' on' : '') + '" data-slot="' + lv + '" data-i="' + i + '" aria-label="Espacio ' + lv + ' número ' + (i + 1) + '">' + (i < used ? '×' : '') + '</button>';
    }
    h += '</span><span class="bm">' + (2 * lv) + 'd8</span></div>';
  }
  h += '</div>';

  // ── Blood Magic
  var bm = D.bloodMagic.tabla[bmLvl - 1];
  h += '<div class="sec"><h3 class="s">Blood Magic · ' + (D.bloodMagic_max() - S.res.bloodmagic) + ' usos</h3><div class="card bmcalc">';
  h += '<div class="lvls">';
  for (var n = 1; n <= 9; n++){
    h += '<button class="pip big' + (bmLvl === n ? ' on' : '') + '" data-bm="' + n + '">' + n + '</button>';
  }
  h += '</div><div class="bmout"><div class="big">' + bm.coste + ' <span style="font-size:13px;color:var(--ash)">PV reales</span></div>' +
    '<div class="sub">Promedio ' + bm.promedio + ' · ' + (bm.agotamiento ? '<b>' + bm.agotamiento + ' de agotamiento</b>' : 'sin agotamiento') + '</div>';
  h += '<div class="pad" style="margin-top:2px"><input id="bmamt" type="number" inputmode="numeric" placeholder="tirada" min="0" aria-label="PV tirados">' +
    '<button class="heal" data-bmroll="1">Tirar</button><button class="dmg" data-bmpay="1">Pagar</button></div></div>';
  h += '<div class="note"><span class="lab">Bathed in Blood / Unholy Gift</span>' + block(D.bloodMagic.bathed.texto) + '</div>';
  h += '</div>';
  h += acc('Reglas completas de Blood Magic', '', block(D.bloodMagic.reglas.map(function(x){ return '- ' + x; })) +
    '<div class="tw"><table class="dmg"><thead><tr><th>Nivel</th><th>Coste</th><th>Prom.</th><th>Agot.</th></tr></thead><tbody>' +
    D.bloodMagic.tabla.map(function(r){ return '<tr><td>' + r.nivel + '</td><td>' + r.coste + '</td><td>' + r.promedio + '</td><td>' + r.agotamiento + '</td></tr>'; }).join('') +
    '</tbody></table></div><p style="font-size:14px;color:var(--ash)">' + fmt(D.bloodMagic.carta) + '</p>');
  h += '</div>';

  // ── Recursos
  h += '<div class="sec"><h3 class="s">Recursos</h3><div class="card">';
  D.recursos.forEach(function(r){
    var rest = r.max - S.res[r.id];
    h += '<div class="resrow"><span class="nm">' + esc(r.nombre) + '<small>' + esc(r.recuperacion) + '</small></span>' +
      '<span class="stepper"><button data-res="' + r.id + '" data-dir="-1" aria-label="Devolver uso">−</button>' +
      '<span class="val' + (rest === 0 ? ' zero' : '') + '">' + rest + ' / ' + r.max + '</span>' +
      '<button data-res="' + r.id + '" data-dir="1" aria-label="Gastar uso">+</button></span></div>';
  });
  h += '</div></div>';

  // ── Overrides
  h += '<div class="sec"><h3 class="s">Ajustar en combate</h3><div class="ovgrid">' +
    ovBox('ca', 'CA', D.cuerpo.ca) +
    ovBox('cd', 'CD conjuro', D.cuerpo.cd) +
    ovBox('atk', 'Ataque', D.cuerpo.ataque) +
    ovBox('vel', 'Velocidad', D.cuerpo.velocidad) +
    ovBox('ini', 'Iniciativa', pers(S.p).iniciativa) +
    ovBox('hpMax', 'PV máx.', D.cuerpo.hpMax) +
    '</div>' +
    '<p class="count" style="margin:10px 0 0">En ámbar, lo que está modificado. Se vuelve al valor de ficha con el botón de abajo.</p>' +
    '<button class="big-btn" data-ovreset="1" style="margin-top:10px">Restaurar valores de ficha</button></div>';

  // ── Descansos
  h += '<div class="sec"><h3 class="s">Descansos</h3><div class="two">' +
    '<button class="big-btn" data-rest="corto">Descanso corto</button>' +
    '<button class="big-btn prime" data-rest="largo">Descanso largo</button></div>';
  h += acc('Qué recupera cada uno', '', '<h4 class="sub">Descanso corto</h4>' + block(D.descansos.corto.map(function(x){ return '- ' + x; })) +
    '<h4 class="sub">Descanso largo</h4>' + block(D.descansos.largo.map(function(x){ return '- ' + x; })));
  h += '</div>';

  // ── Recordatorios
  h += '<div class="sec"><h3 class="s">Recordatorios de turno</h3><div class="card"><ol style="margin:0;padding-left:19px">' +
    D.recordatorios.map(function(x){ return '<li style="margin-bottom:6px">' + fmt(x) + '</li>'; }).join('') + '</ol></div>';
  h += '<div class="note warn" style="margin-top:12px"><span class="lab">Límite de lanzamientos</span>' + block(D.limiteTurno) + '</div></div>';

  h += '<p class="sync" id="syncLine">Guardado en este dispositivo</p>';
  h += '</div>';
  return h;
}
function ovBox(k, label, base){
  var v = (S.ov[k] === undefined || S.ov[k] === null || S.ov[k] === '') ? base : S.ov[k];
  var edited = v !== base;
  return '<div class="ov"><label for="ov-' + k + '">' + label + '</label>' +
    '<input id="ov-' + k + '" type="number" inputmode="numeric" class="' + (edited ? 'edited' : '') + '" value="' + v + '" data-ov="' + k + '"></div>';
}

/* ══════════ Vista: PODERES ══════════ */
function viewPoderes(){
  var h = '<div class="sec"><p class="eyebrow">Rites · Boons · Champi</p><h2 class="t">Poderes</h2></div>';

  ['mysha','selenne','veltra'].forEach(function(pid){
    var p = pers(pid);
    h += '<div class="sec"><h3 class="s" style="color:var(--' + pid + ')">Rites de ' + esc(p.nombre) + '</h3>';
    D.rites[pid].forEach(function(r){
      var inner = block(r.texto);
      if (r.tabla){
        inner += '<div class="tw"><table class="dmg"><thead><tr><th>Movimiento preparado</th><th>Daño adicional</th></tr></thead><tbody>' +
          r.tabla.map(function(t){ return '<tr><td>' + esc(t.mov) + '</td><td>' + esc(t.dano) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      if (r.extremo) inner += block(r.extremo.map(function(x){ return '- ' + x; }));
      if (r.pendiente) inner += '<div class="note warn"><span class="lab">Pendiente del DM</span>' + fmt(r.pendiente) + '</div>';
      h += acc(r.nombre, r.meta, inner);
    });
    h += '</div>';
  });

  h += '<div class="sec"><h3 class="s">Boons compartidos</h3>';
  D.boons.forEach(function(b){
    var inner = block(b.texto);
    if (b.pendiente) inner += '<div class="note warn"><span class="lab">Pendiente del DM</span>' + fmt(b.pendiente) + '</div>';
    h += acc(b.nombre, '', inner);
  });
  h += '</div>';

  h += '<div class="sec"><h3 class="s">Champi</h3><div class="grid3" style="margin-bottom:10px">' +
    D.champi.stats.slice(0, 6).map(function(s){ return cell(s.k, s.v); }).join('') + '</div>';
  h += '<div class="card">' + block(D.champi.rasgos.map(function(x){ return '- ' + x; })) + '</div>';
  h += acc('Hechizo almacenado', '1 a la vez', block(D.champi.almacenado.map(function(x){ return '- ' + x; })));
  h += acc('Concentración doble durante una ronda', '', block(D.champi.dobleConcentracion));
  h += acc('Familiar Bond', '5 usos · 68 puntos', block(D.champi.familiarBond.map(function(x){ return '- ' + x; })));
  h += '</div>';

  h += '<div class="sec"><h3 class="s">Ritual Caster</h3><div class="card">' +
    block(D.ritualCaster.map(function(x){ return '- ' + x; })) + '</div></div>';

  h += '<div class="sec"><h3 class="s">Propiedad de los hechizos</h3><div class="card">' +
    block(D.propiedadHechizos.map(function(x){ return '- ' + x; })) + '</div></div>';

  return h;
}

/* ══════════ Vista: OBJETOS ══════════ */
function viewObjetos(){
  var h = '<div class="sec"><p class="eyebrow">Inventario canónico</p><h2 class="t">Objetos</h2>';
  h += '<div class="note warn" style="margin-top:12px"><span class="lab">Vinculación pendiente</span>' + fmt(D.objetosAviso) + '</div></div>';

  h += '<div class="sec">';
  D.objetos.forEach(function(o){
    var inner = block(o.texto);
    if (o.sub){
      inner += '<h4 class="sub">' + esc(o.sub.nombre) + '</h4>' + block(o.sub.texto);
    }
    if (o.pendiente) inner += '<div class="note warn"><span class="lab">Pendiente del DM</span>' + fmt(o.pendiente) + '</div>';
    h += acc(o.nombre, o.tipo, inner);
  });
  h += '</div>';

  h += '<div class="sec"><h3 class="s">Combinaciones importantes</h3>';
  D.combos.forEach(function(c){ h += acc(c.nombre, '', block([c.texto])); });
  h += '</div>';

  h += '<div class="sec"><h3 class="s">Pendientes del DM</h3>' +
    '<p style="color:var(--ash);font-size:14.5px">' + fmt(D.pendientesDM.aviso) + '</p>';
  D.pendientesDM.grupos.forEach(function(g){
    h += acc(g.titulo, g.items.length + ' puntos', block(g.items.map(function(x){ return '- ' + x; })));
  });
  h += '</div>';
  return h;
}

/* ══════════ Render ══════════ */
function render(){
  var y = view.scrollTop;
  var html = tab === 'ficha' ? viewFicha()
    : tab === 'hechizos' ? viewHechizos()
    : tab === 'mesa' ? viewMesa()
    : tab === 'poderes' ? viewPoderes()
    : viewObjetos();
  view.innerHTML = html;
  paintSwitch();
  paintTabs();
  paintGlance();
  if (keepScroll){ view.scrollTop = y; keepScroll = false; } else { view.scrollTop = 0; }
  if (DB) markSync();
}
var keepScroll = false;
function rerender(){ keepScroll = true; render(); }
// Los re-render disparados desde un click se difieren un tick: si se reemplaza
// el DOM dentro del propio manejador, el navegador vuelve a dirigir el click al
// elemento nuevo que quedó debajo del dedo y se activa algo que nadie tocó.
function later(fn){ setTimeout(fn, 0); }
function markSync(){
  var el = document.getElementById('syncLine');
  if (el) el.innerHTML = 'Guardado en este dispositivo y <b>sincronizado</b>';
}

/* ══════════ Acciones ══════════ */
function applyDamage(n){
  if (n <= 0) return;
  var abs = S.hpTemp >= n ? 0 : n - S.hpTemp;
  S.hpTemp = Math.max(0, S.hpTemp - n);
  S.hp = clamp(S.hp - abs, 0, stat('hpMax'));
  save();
}
function longRest(){
  S.hp = stat('hpMax');
  S.hpTemp = 0;
  S.agot = 0;
  S.conc = '';
  for (var i = 1; i <= 9; i++) S.slots[i] = 0;
  D.recursos.forEach(function(r){ S.res[r.id] = 0; });
  S.cond = {};
  save();
  toast('Descanso largo: PV, espacios y recursos al máximo.');
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button, summary');
  if (!t) return;

  // No dejar que un click atraviese hacia la app mientras hay una hoja abierta.
  if (document.getElementById('sheet') && !t.closest('#sheet')) return;

  // Personalidad
  if (t.dataset.p){ S.p = t.dataset.p; save(); later(render); return; }

  // Pestaña
  if (t.dataset.t){ tab = t.dataset.t; later(render); return; }

  // Hechizos: filtros — solo se repinta la lista, no la vista entera.
  if (t.dataset.n !== undefined && t.classList.contains('chip')){
    var n = parseInt(t.dataset.n, 10);
    F.nivel = (F.nivel === n) ? null : n;
    t.parentNode.querySelectorAll('[data-n]').forEach(function(b){
      b.setAttribute('aria-pressed', String(parseInt(b.dataset.n, 10) === F.nivel));
    });
    later(repaintList); return;
  }
  if (t.dataset.d){
    F.duena = (F.duena === t.dataset.d) ? null : t.dataset.d;
    t.parentNode.querySelectorAll('[data-d]').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.d === F.duena));
    });
    later(repaintList); return;
  }
  if (t.dataset.c){ F.conc = !F.conc; t.setAttribute('aria-pressed', String(F.conc)); later(repaintList); return; }
  if (t.dataset.r){ F.ritual = !F.ritual; t.setAttribute('aria-pressed', String(F.ritual)); later(repaintList); return; }
  if (t.id === 'clrq'){
    F.q = '';
    var qi = document.getElementById('q');
    if (qi){ qi.value = ''; qi.focus(); }
    later(repaintList); return;
  }

  // Abrir hechizo
  if (t.dataset.s){ sheetHechizo(t.dataset.s); return; }
  if (t.id === 'closeSheet'){ var sh = document.getElementById('sheet'); if (sh) sh.remove(); return; }

  // Lanzar desde la hoja
  if (t.dataset.cast){
    var lv = parseInt(t.dataset.lv, 10);
    if (t.dataset.cast === 'slot'){
      if (S.slots[lv] < D.espaciosMax[lv]){
        S.slots[lv]++; save();
        toast('Espacio de nivel ' + lv + ' gastado. Quedan ' + (D.espaciosMax[lv] - S.slots[lv]) + '.');
      }
    } else {
      var b = D.bloodMagic.tabla[lv - 1];
      var r = roll(2 * lv, 8);
      if (S.res.bloodmagic < D.bloodMagic_max()) S.res.bloodmagic++;
      applyDamage(r);
      S.agot = clamp(S.agot + b.agotamiento, 0, 6);
      save();
      toast('Blood Magic nivel ' + lv + ': ' + b.coste + ' = ' + r + ' PV' + (b.agotamiento ? ' · +' + b.agotamiento + ' agotamiento' : ''));
    }
    var sh2 = document.getElementById('sheet'); if (sh2) sh2.remove();
    paintGlance();
    if (tab === 'mesa') later(rerender);
    return;
  }

  // Mesa: vida
  if (t.dataset.hp){
    var inp = document.getElementById('amt');
    var v = Math.max(0, parseInt(inp && inp.value, 10) || 0);
    if (t.dataset.hp === 'dmg'){ applyDamage(v); }
    else if (t.dataset.hp === 'heal'){ S.hp = clamp(S.hp + v, 0, stat('hpMax')); save(); }
    else if (t.dataset.hp === 'temp'){ S.hpTemp = Math.max(S.hpTemp, v); save(); }
    else if (t.dataset.hp === 'full'){ S.hp = stat('hpMax'); S.hpTemp = 0; save(); }
    else if (t.dataset.hp === 'zero'){ S.hp = 0; S.hpTemp = 0; save(); toast('A 0 PV: se activa Mystra’s Gift si queda uso.'); }
    if (inp) inp.value = '';
    later(rerender); return;
  }

  // Estados
  if (t.dataset.cond){ S.cond[t.dataset.cond] = !S.cond[t.dataset.cond]; save(); later(rerender); return; }
  if (t.dataset.conc){ S.conc = S.conc ? '' : '1'; save(); later(rerender); return; }
  if (t.dataset.agot !== undefined && t.dataset.agot !== ''){ S.agot = parseInt(t.dataset.agot, 10); save(); later(rerender); return; }

  // Espacios
  if (t.dataset.slot){
    var l = parseInt(t.dataset.slot, 10), idx = parseInt(t.dataset.i, 10);
    S.slots[l] = (idx < S.slots[l]) ? idx : idx + 1;
    save(); later(rerender); return;
  }

  // Blood Magic
  if (t.dataset.bm){ bmLvl = parseInt(t.dataset.bm, 10); later(rerender); return; }
  if (t.dataset.bmroll){
    var rr = roll(2 * bmLvl, 8);
    var bi = document.getElementById('bmamt');
    if (bi) bi.value = rr;
    toast('Tirada ' + D.bloodMagic.tabla[bmLvl - 1].coste + ': ' + rr + ' PV');
    return;
  }
  if (t.dataset.bmpay){
    var bi2 = document.getElementById('bmamt');
    var pay = Math.max(0, parseInt(bi2 && bi2.value, 10) || D.bloodMagic.tabla[bmLvl - 1].promedio);
    var ag = D.bloodMagic.tabla[bmLvl - 1].agotamiento;
    applyDamage(pay);
    S.agot = clamp(S.agot + ag, 0, 6);
    if (S.res.bloodmagic < D.bloodMagic_max()) S.res.bloodmagic++;
    save();
    toast('Pagaste ' + pay + ' PV' + (ag ? ' y +' + ag + ' de agotamiento' : '') + '.');
    later(rerender); return;
  }

  // Recursos
  if (t.dataset.res){
    var id = t.dataset.res, dir = parseInt(t.dataset.dir, 10);
    var mx = D.recursos.filter(function(r){ return r.id === id; })[0].max;
    S.res[id] = clamp(S.res[id] + dir, 0, mx);
    save(); later(rerender); return;
  }

  // Overrides y descansos
  if (t.dataset.ovreset){ S.ov = {}; save(); later(rerender); toast('Valores de ficha restaurados.'); return; }
  if (t.dataset.rest === 'largo'){ longRest(); later(rerender); return; }
  if (t.dataset.rest === 'corto'){ toast('Descanso corto: gastá dados de golpe y prepará Witch’s Brew. No recupera Cambios ni Blood Magic.'); return; }
});

// Buscador y campos de texto
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'q'){ F.q = el.value; repaintList(); return; }
  if (el.dataset && el.dataset.ov){
    var k = el.dataset.ov;
    S.ov[k] = el.value === '' ? null : parseInt(el.value, 10);
    save(); paintGlance();
    el.classList.toggle('edited', S.ov[k] !== null && S.ov[k] !== stat0(k));
    return;
  }
  if (el.id === 'concnm'){ S.conc = el.value || '1'; save(); paintGlance(); return; }
});
function stat0(k){
  if (k === 'ca') return D.cuerpo.ca;
  if (k === 'cd') return D.cuerpo.cd;
  if (k === 'atk') return D.cuerpo.ataque;
  if (k === 'vel') return D.cuerpo.velocidad;
  if (k === 'ini') return pers(S.p).iniciativa;
  if (k === 'hpMax') return D.cuerpo.hpMax;
  return 0;
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ var sh = document.getElementById('sheet'); if (sh) sh.remove(); }
});

/* ══════════ Arranque ══════════ */
load();
render();

// Sincronización durable, si el visor la concede. La página funciona sin esto.
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('db').then(function(db){
    if (!db) return;
    DB = db;
    return db.doc('mesa/estado').get().then(function(doc){
      if (doc && doc.updatedAt && doc.updatedAt > S.updatedAt){
        merge(doc);
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        render();
        toast('Estado recuperado de la nube.');
      } else {
        markSync();
      }
    });
  }).catch(function(){ /* sin sincronización: se sigue con el almacenamiento local */ });
}
})();
</script>
</body>
